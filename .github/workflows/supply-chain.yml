name: supply-chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  betterleaks:
    # NOT ubuntu-slim: sigstore/cosign-installer shells out to `envsubst`, which slim's
    # image has no gettext for, and slim is unprivileged so the job cannot install it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # LOAD-BEARING: `betterleaks git` walks commits, so the default
          # shallow clone hides a key committed last month.
          fetch-depth: 0
          persist-credentials: false

      # Stays PINNED while betterleaks below does not: cosign is a build tool,
      # betterleaks is a signature scanner.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: betterleaks secret scan
        # betterleaks is resolved fresh EVERY RUN, deliberately unpinned: its value is the
        # current ruleset, and a version pin scans with whatever shipped the day this file
        # was scaffolded. Safe only because the release is VERIFIED, not trusted: cosign
        # binds checksums.txt to betterleaks' own release.yml at the resolved tag, then
        # sha256sum binds the tarball to that verified checksums.txt.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Unpack OUTSIDE the workspace: a 20 MB Go binary of compressed
          # entropy is exactly what a secret scanner is built to flag.
          cd "${RUNNER_TEMP}"
          TAG=$(gh release view -R betterleaks/betterleaks --json tagName -q .tagName)
          gh release download "$TAG" -R betterleaks/betterleaks \
            -p 'betterleaks_*_linux_x64.tar.gz' -p checksums.txt -p checksums.txt.sigstore.json
          # NEVER pipe cosign: `run:` is `bash -e` WITHOUT pipefail, so a pipe
          # swallows the verify failure and the job proceeds unverified.
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/betterleaks/betterleaks/.github/workflows/release.yml@refs/tags/${TAG}" \
            checksums.txt
          grep linux_x64 checksums.txt | sha256sum -c -
          tar -xzf betterleaks_*_linux_x64.tar.gz betterleaks
          # --redact so a finding never prints the credential into a CI log.
          # --confidence medium (needs betterleaks >=1.8.0) keeps this gate quiet as
          # upstream broadens its rules: the three generic rules grade each hit from its
          # surrounding context, so fixture and README noise lands below the bar with no
          # repo-local allowlist, and no rule that names an issuer is touched. Never tune
          # it with a config `filter` instead - a global filter REPLACES upstream's
          # curated placeholder list rather than adding to it.
          ./betterleaks git "${GITHUB_WORKSPACE}" --no-banner --redact=100 --confidence medium

  zizmor:
    runs-on: ubuntu-slim # audits a handful of YAML files
    timeout-minutes: 5 # slim terminates at 15 on its own
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: zizmor workflow audit
        # `|| true`: zizmor exits 14 on findings, which would abort before the filter
        # runs. Then fail CLOSED on non-JSON - a gate must not wave a PR through on a
        # scan error. `unpinned-uses` is excluded BY IDENT; status-action-pins.sh owns
        # pinnedness. This filter is verbatim status-zizmor.sh's, which is canonical.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT=$(uvx zizmor --format json --min-severity=medium .github/workflows || true)
          if ! jq -e 'type == "array"' <<<"$OUT" >/dev/null 2>&1; then
            echo "::error::zizmor returned no valid JSON (scan errored) - failing closed"; exit 1
          fi
          HITS=$(jq '[.[] | select(.ident != "unpinned-uses")]' <<<"$OUT")
          N=$(jq 'length' <<<"$HITS")
          if [ "$N" -gt 0 ]; then
            jq -r 'group_by(.ident) | map("\(.[0].ident)x\(length)") | join(", ")' <<<"$HITS"
            echo "::error::zizmor found $N medium+ workflow finding(s)"; exit 1
          fi
