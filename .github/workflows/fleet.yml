name: notambourine

# Keep this name and the job ID stable: the required check uses both.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fleet-actions:
    permissions:
      contents: read
    uses: notambourine/fleet-actions/.github/workflows/fleet-ci.yml@be38cfcf9f9a3447ea3915d0231d027ef1992658 # v1.10.0
    with:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      actionlint-extra-labels: blacksmith-2vcpu-ubuntu-2404
      dash-force-zero: true
      dash-exclude-defaults: false
      # npm repo; corepack pins nothing here.
      pnpm-pin: false
