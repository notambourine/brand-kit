name: Publish

# Publishes @notambourine/brand-kit on a v* tag. Trusted publishing, so there is no
# NPM_TOKEN to leak and npm signs a provenance attestation on its own.
# The trusted publisher on npmjs.com must name this file: npm-publish.yml
# https://docs.npmjs.com/trusted-publishers

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # A tag that disagrees with the manifest publishes a version nobody can find by tag.
      - name: Match the tag to the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(npm pkg get version | tr -d '"')"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: npm install -g npm@latest # OIDC needs npm >= 11.5.1

      - run: npm publish
