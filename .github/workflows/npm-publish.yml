name: Publish

# Publishes @notambourine/brand-kit when a merge to main carries a version the registry
# does not have yet. The manifest is the trigger; the v* tag and its GitHub release are
# written after the publish lands, so neither exists for a version npm rejected.
# Trusted publishing, so there is no NPM_TOKEN to leak and npm signs provenance on its own.
# The trusted publisher on npmjs.com must name this file: npm-publish.yml
# https://docs.npmjs.com/trusted-publishers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # writes the v* tag after publishing
      id-token: write
    # GitHub-hosted, not blacksmith or slim: npm trusted publishing and provenance reject
    # self-hosted runners, and a runner surprise here would half-ship a version.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Uncached: a PR-written cache must never feed a publish.
          package-manager-cache: false

      # A registry read that fails must not read as "unpublished" and double-publish, so
      # only a real E404 counts as "not there yet". `versions` is a bare string, not an
      # array, when exactly one version is published - flatten before asking.
      - name: Is this version already on npm
        id: check
        run: |
          name="$(npm pkg get name | tr -d '"')"
          version="$(npm pkg get version | tr -d '"')"
          if ! published="$(npm view "$name" versions --json 2>&1)"; then
            case "$published" in
              *E404*) published='[]' ;;
              *) echo "$published"; echo "registry read failed"; exit 1 ;;
            esac
          fi
          if jq -e --arg v "$version" '[.] | flatten | index($v)' <<<"$published" >/dev/null; then
            echo "$name@$version is already published; nothing to do"
            echo "publish=false" >>"$GITHUB_OUTPUT"
          else
            echo "publish=true" >>"$GITHUB_OUTPUT"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - if: steps.check.outputs.publish == 'true'
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - if: steps.check.outputs.publish == 'true'
        run: sfw npm ci --ignore-scripts

      - if: steps.check.outputs.publish == 'true'
        run: npm publish

      - if: steps.check.outputs.publish == 'true'
        name: Tag and release the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
