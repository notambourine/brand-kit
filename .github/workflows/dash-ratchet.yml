name: Dash ratchet

# Zero unicode dashes in the tree. The engine, the runner tier, and the timeout
# live in notambourine/dash-ratchet; this file owns the trigger and the mode.
# Contract and inputs: https://github.com/notambourine/dash-ratchet
#
# force-zero, not the ratchet: the repo is already at zero, so a count to
# compare buys nothing and the base-ref resolve is complexity with no payoff.
# One tree, one grep, depth 1 - and it catches a dash the PR never touched.
#
# exclude-defaults off because nothing here is a package manager's or an agent's
# bytes: no lockfile, no vendored tree, and the two licenses carry no dash.
#
# PR-only on purpose: on a push to main there is nothing left to block.

concurrency:
  group: dashes-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dashes:
    uses: notambourine/dash-ratchet/.github/workflows/ratchet.yml@556a4457c467fb9c28a3240f7f030bf9204cb357 # v0.4.0
    with:
      force-zero: true
      exclude-defaults: false
